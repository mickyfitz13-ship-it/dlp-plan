const fs = require('fs');
const path = require('path');

const FILE_PATH = path.join(__dirname, 'telemetry.json');
const TARGET_SIZE_BYTES = 20 * 1024 * 1024; // 20 MB Cap

// Helper to check current file size or JSON payload size
function getByteSize(data) {
  return Buffer.byteLength(JSON.stringify(data), 'utf8');
}

// Retention logic that only triggers when approaching the 20MB limit
function enforceSizeCap(telemetryData) {
  let currentSize = getByteSize(telemetryData);

  // If we are well under 20 MB, keep 100% of raw historical data
  if (currentSize < TARGET_SIZE_BYTES) {
    return telemetryData;
  }

  console.log('Telemetry approaching 20 MB ceiling. Downsampling older entries...');

  const NOW = Date.now();
  const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
  const prunedData = {};

  for (const [queueId, entries] of Object.entries(telemetryData)) {
    if (!Array.isArray(entries) || entries.length === 0) {
      prunedData[queueId] = [];
      continue;
    }

    const sorted = [...entries].sort((a, b) => a.t - b.t);
    const recentRaw = [];
    const olderBuckets = {}; // Group older entries by Day (YYYY-MM-DD)

    for (const entry of sorted) {
      const age = NOW - entry.t;
      if (age <= THIRTY_DAYS_MS) {
        // Keep last 30 days 100% raw no matter what
        recentRaw.push(entry);
      } else {
        const dateKey = new Date(entry.t).toISOString().split('T')[0];
        if (!olderBuckets[dateKey]) olderBuckets[dateKey] = [];
        olderBuckets[dateKey].push(entry);
      }
    }

    // Collapse entries older than 30 days into 1 daily median point
    const condensedOlder = Object.values(olderBuckets).map(group => {
      if (group.length === 1) return group[0];
      const sortedGroup = [...group].sort((a, b) => a.w - b.w);
      const mid = Math.floor(sortedGroup.length / 2);
      return {
        t: group[0].t,
        w: sortedGroup[mid].w
      };
    });

    prunedData[queueId] = [...condensedOlder, ...recentRaw].sort((a, b) => a.t - b.t);
  }

  return prunedData;
}

// --- MAIN SWEEP LOGIC ---
async function runSweep() {
  console.log('Starting telemetry sweep...');

  let telemetry = {};
  if (fs.existsSync(FILE_PATH)) {
    try {
      telemetry = JSON.parse(fs.readFileSync(FILE_PATH, 'utf8'));
    } catch (err) {
      console.error('Error reading telemetry.json, starting fresh:', err);
      telemetry = {};
    }
  }

  // --- YOUR QUEUE FETCHING LOGIC HERE ---
  // Append new timestamped entries to `telemetry` object as usual

  // Enforce the 20 MB cap check
  const finalTelemetry = enforceSizeCap(telemetry);

  fs.writeFileSync(FILE_PATH, JSON.stringify(finalTelemetry), 'utf8');
  console.log(`Telemetry saved. Current size: ${(getByteSize(finalTelemetry) / (1024 * 1024)).toFixed(2)} MB`);
}

runSweep().catch(console.error);
